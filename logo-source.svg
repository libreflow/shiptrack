<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- fond arrondi -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#0f172a"/>

  <!-- boîte / colis stylisé, vu de 3/4 -->
  <g transform="translate(256,270)">
    <!-- face gauche -->
    <polygon points="-140,-40 0,20 0,150 -140,90" fill="#1d4ed8"/>
    <!-- face droite -->
    <polygon points="140,-40 0,20 0,150 140,90" fill="url(#boxGrad)"/>
    <!-- dessus -->
    <polygon points="-140,-40 0,-100 140,-40 0,20" fill="url(#lidGrad)"/>
    <!-- ruban vertical -->
    <polygon points="-14,-70 14,-56 14,145 -14,131" fill="#0f172a" opacity="0.35"/>
    <!-- ruban horizontal sur le dessus -->
    <polygon points="-140,-40 -112,-54 28,6 0,20" fill="#0f172a" opacity="0.2"/>
  </g>

  <!-- flèche de suivi -->
  <g transform="translate(256,120)">
    <path d="M -60,20 A 60,60 0 1 1 60,20" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round"/>
    <polygon points="60,20 90,10 68,42" fill="#38bdf8"/>
  </g>
</svg>
